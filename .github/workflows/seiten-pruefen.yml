name: Seiten erreichbar?

# Prueft taeglich, ob Dieters Live-Seiten ueber HTTPS sauber laden --
# inklusive gueltigem Zertifikat. Laeuft auf GitHubs Servern, also auch
# wenn der Mac aus ist (Urlaub, Reise).
#
# Hintergrund: profilretter.de lief vom 24. bis 26.07.2026 unbemerkt ohne
# SSL-Zertifikat. Besucher sahen eine Sicherheitswarnung statt der Seite,
# auf der PayPal und IBAN stehen. Das soll nicht nochmal passieren.
#
# Meldung nur, wenn etwas kaputt ist -- Stille heisst, es laeuft.
# Beim manuellen Start ueber den Browser kommt immer eine Meldung,
# damit man den Telegram-Kanal testen kann.

on:
  schedule:
    - cron: "0 6 * * *"    # taeglich 06:00 UTC = 08:00 deutscher Sommerzeit
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Seiten abklopfen
        id: check
        run: |
          PROBLEME=""
          for URL in https://profilretter.de https://ausschreibungsradar.de; do
            # ohne -k: ein ungueltiges Zertifikat laesst curl scheitern
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || echo "SSL-FEHLER")
            if [ "$CODE" = "200" ]; then
              echo "OK     $URL"
            else
              echo "FEHLER $URL -> $CODE"
              PROBLEME="${PROBLEME}${URL} -> ${CODE}; "
            fi
          done
          # bewusst einzeilig: ein mehrzeiliger Output waere auch im
          # Gutfall nie ganz leer und wuerde taeglich Fehlalarm ausloesen
          if [ -n "$PROBLEME" ]; then
            echo "kaputt=ja" >> "$GITHUB_OUTPUT"
            echo "details=$PROBLEME" >> "$GITHUB_OUTPUT"
          else
            echo "kaputt=nein" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram bei Problemen
        if: steps.check.outputs.kaputt == 'ja'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=⚠️ Seiten-Check: nicht sauber erreichbar — ${{ steps.check.outputs.details }} Bei SSL-FEHLER fehlt das Zertifikat, Besucher sehen dann eine Sicherheitswarnung. Nachsehen unter github.com/Leschsch77/profilretter/settings/pages" \
            -o /dev/null
          echo "Telegram-Warnung verschickt."
          exit 1

      - name: Bestaetigung beim manuellen Start
        if: github.event_name == 'workflow_dispatch' && steps.check.outputs.kaputt == 'nein'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=✅ Seiten-Check: profilretter.de und ausschreibungsradar.de laden beide sauber über HTTPS." \
            -o /dev/null
          echo "Bestaetigung verschickt."
